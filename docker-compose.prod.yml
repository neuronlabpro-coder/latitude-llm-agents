services:
  web:
    image: latitudedata/web:${LAT_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${LAT_WEB_PORT:-3000}/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  api:
    image: latitudedata/api:${LAT_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${LAT_API_PORT:-3001}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  ingest:
    image: latitudedata/ingest:${LAT_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "3002:3002"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${LAT_INGEST_PORT:-3002}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  workers:
    image: latitudedata/workers:${LAT_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${LAT_WORKERS_HEALTH_PORT:-9090}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  workflows:
    image: latitudedata/workflows:${LAT_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${LAT_WORKFLOWS_HEALTH_PORT:-9091}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  migrations:
    image: latitudedata/migrations:${LAT_IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    command: postgres -c wal_level=logical
    ports:
      - "5532:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  clickhouse:
    image: clickhouse/clickhouse-server:26.2
    restart: unless-stopped
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/storage.xml:/etc/clickhouse-server/config.d/storage.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis-bullmq:
    image: redis:7
    restart: unless-stopped
    command: redis-server --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redis_bullmq_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.27.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-latitude}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility

  seaweedfs:
    image: chrislusf/seaweedfs:4.32
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/init.sh"]
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
    volumes:
      - seaweedfs_data:/data
      - ./docker/seaweedfs/init.sh:/init.sh:ro

volumes:
  postgres_data:
  clickhouse_data:
  redis_bullmq_data:
  seaweedfs_data:
